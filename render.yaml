services:
  - type: web
    name: clarendon-tracker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /login.html
    autoDeployTrigger: commit
    disk:
      name: clarendon-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_OWNER_EMAIL
        sync: false
      - key: DEFAULT_OWNER_PASSWORD
        sync: false
      - key: DEFAULT_OWNER_NAME
        value: Practice Owner
      - key: DATA_DIR
        value: /opt/render/project/src/storage/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/storage/uploads