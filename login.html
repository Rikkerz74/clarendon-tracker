<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Clarendon Dental</title>
    <meta name="description" content="Sign in to the Clarendon Dental hosted plan tracker." />
    <style>
      :root { color-scheme: light; --bg: #eef6fc; --panel: rgba(255,255,255,.92); --brand: #1090c0; --brand-dark:#004070; --ink:#0d2d4a; --muted:#44607b; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; color:var(--ink); background: radial-gradient(circle at top left, rgba(16,144,192,.16), transparent 28%), linear-gradient(160deg, var(--bg), #fff); }
      .card { width:min(520px, calc(100vw - 32px)); padding:28px; border-radius:28px; background:var(--panel); box-shadow: 0 22px 60px rgba(0,64,112,.12); border:1px solid rgba(16,144,192,.14); }
      h1 { margin:0 0 8px; font-size: clamp(1.8rem, 3vw, 2.6rem); }
      p { margin:0; color:var(--muted); line-height:1.6; }
      form { display:grid; gap:14px; margin-top:20px; }
      label { display:grid; gap:8px; font-weight:700; font-size:.9rem; color:var(--muted); }
      input { padding:14px 16px; border-radius:14px; border:1px solid rgba(16,144,192,.18); font:inherit; }
      button { padding:14px 16px; border:none; border-radius:14px; background:linear-gradient(135deg, var(--brand), var(--brand-dark)); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
      .hint { margin-top:16px; font-size:.88rem; color:var(--muted); }
      .error { min-height:1.2em; color:#8d302d; font-weight:700; }
      .login-brand { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
      .login-brand img { display:none; }
      .corner-brand { position:fixed; top:18px; right:18px; display:grid; gap:6px; justify-items:end; z-index:5; }
      .corner-brand img { width:92px; height:92px; object-fit:contain; }
      .corner-brand span { text-transform:uppercase; letter-spacing:.12em; font-size:.68rem; font-weight:800; color:var(--brand-dark); background:rgba(255,255,255,.82); border:1px solid rgba(16,144,192,.2); padding:4px 8px; border-radius:999px; }
      @media (max-width: 720px) {
        .corner-brand { top:12px; right:12px; }
        .corner-brand img { width:70px; height:70px; }
      }
    </style>
  </head>
  <body>
    <div class="corner-brand" aria-hidden="true">
      <img src="assets/tdbmlogo.png" alt="" />
      <span>TDBM</span>
    </div>
    <main class="card">
      <div class="login-brand">
        <img src="assets/tdbmlogo.png" alt="The Dental Business Manager logo" />
        <p style="text-transform:uppercase; letter-spacing:.16em; font-size:.74rem; font-weight:800; color:var(--brand);">The Dental Business Manager</p>
      </div>
      <h1>Clarendon Dental sign in</h1>
      <p>Sign in to view and update the live business plan. Changes are shared across owners and saved on the server.</p>
      <form id="loginForm">
        <label>
          Email
          <input type="email" name="email" autocomplete="username" value="owner@clarendon.local" />
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" value="ChangeMe123!" />
        </label>
        <button type="submit">Sign in</button>
        <div class="error" id="error"></div>
      </form>
      <p class="hint">Demo login for the first hosted version: owner@clarendon.local / ChangeMe123!</p>
    </main>
    <script>
      const form = document.getElementById('loginForm');
      const error = document.getElementById('error');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.textContent = '';
        const formData = new FormData(form);
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: formData.get('email'), password: formData.get('password') })
        });
        if (!response.ok) {
          error.textContent = 'Sign in failed. Check the email and password.';
          return;
        }
        window.location.href = '/index.html';
      });
    </script>
  </body>
</html>
